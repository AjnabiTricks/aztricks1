<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>AZ Tricks - SIM/CNIC Tracker</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 15px;
            padding-top: 30px;
        }
        
        .container {
            background: white;
            border-radius: 20px;
            padding: 25px 20px;
            max-width: 500px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            margin-bottom: 20px;
        }
        
        .logo {
            text-align: center;
            margin-bottom: 5px;
        }
        
        .logo h1 {
            font-size: 28px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-weight: 900;
        }
        
        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 20px;
            font-size: 13px;
        }
        
        .subtitle a {
            color: #764ba2;
            text-decoration: none;
            font-weight: bold;
        }
        
        .input-group {
            display: flex;
            gap: 8px;
            margin-bottom: 8px;
        }
        
        input {
            flex: 1;
            padding: 14px;
            border: 2px solid #e0e0e0;
            border-radius: 12px;
            font-size: 16px;
            transition: 0.3s;
            min-width: 0;
            -webkit-appearance: none;
        }
        
        input:focus {
            outline: none;
            border-color: #764ba2;
        }
        
        button {
            padding: 14px 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            cursor: pointer;
            transition: 0.3s;
            font-weight: bold;
            white-space: nowrap;
            -webkit-tap-highlight-color: transparent;
        }
        
        button:active {
            transform: scale(0.95);
        }
        
        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }
        
        .format-hint {
            font-size: 11px;
            color: #888;
            margin-bottom: 12px;
            padding: 6px 10px;
            background: #f8f9fa;
            border-radius: 8px;
            text-align: center;
        }
        
        .format-hint strong {
            color: #764ba2;
        }
        
        .quick-fill {
            display: flex;
            gap: 8px;
            margin-top: 5px;
            flex-wrap: wrap;
            justify-content: center;
        }
        
        .quick-btn {
            padding: 6px 14px;
            background: #e8f0fe;
            border: 1px solid #d0d0d0;
            border-radius: 20px;
            font-size: 12px;
            cursor: pointer;
            transition: 0.3s;
            color: #333;
            -webkit-tap-highlight-color: transparent;
        }
        
        .quick-btn:active {
            transform: scale(0.95);
        }
        
        .quick-btn:hover {
            background: #764ba2;
            color: white;
            border-color: #764ba2;
        }
        
        #result {
            margin-top: 18px;
            display: none;
        }
        
        .card {
            background: #f8f9fa;
            border-radius: 12px;
            padding: 12px 16px;
            margin-bottom: 8px;
            transition: 0.3s;
        }
        
        .card:active {
            transform: scale(0.99);
        }
        
        .card .label {
            color: #666;
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 2px;
        }
        
        .card .value {
            color: #333;
            font-size: 16px;
            font-weight: 600;
            word-break: break-all;
        }
        
        .card .value.highlight {
            color: #764ba2;
        }
        
        .credit {
            text-align: center;
            margin-top: 18px;
            padding: 12px;
            background: #fff3cd;
            border-radius: 10px;
            color: #856404;
            font-size: 13px;
        }
        
        .credit a {
            color: #764ba2;
            font-weight: bold;
            text-decoration: none;
        }
        
        .loader {
            display: none;
            text-align: center;
            padding: 20px;
        }
        
        .loader.active {
            display: block;
        }
        
        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #764ba2;
            border-radius: 50%;
            width: 35px;
            height: 35px;
            animation: spin 1s linear infinite;
            margin: 0 auto;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .status-badge {
            display: inline-block;
            padding: 3px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
        }
        
        .status-success {
            background: #d4edda;
            color: #155724;
        }
        
        .status-failed {
            background: #f8d7da;
            color: #721c24;
        }
        
        .search-type {
            text-align: center;
            font-size: 13px;
            color: #666;
            margin-bottom: 12px;
            padding: 8px;
            background: #e8f0fe;
            border-radius: 8px;
        }
        
        .footer {
            text-align: center;
            margin-top: 12px;
            font-size: 11px;
            color: #999;
        }
        
        /* Mobile optimizations */
        @media (max-width: 480px) {
            .container {
                padding: 18px 14px;
            }
            
            .logo h1 {
                font-size: 24px;
            }
            
            .input-group {
                flex-direction: column;
            }
            
            button {
                width: 100%;
                padding: 14px;
            }
            
            .card {
                padding: 10px 14px;
            }
            
            .card .value {
                font-size: 15px;
            }
            
            .quick-fill {
                gap: 5px;
            }
            
            .quick-btn {
                padding: 5px 12px;
                font-size: 11px;
            }
        }
        
        @media (max-width: 360px) {
            .container {
                padding: 12px 10px;
            }
            
            .logo h1 {
                font-size: 20px;
            }
            
            input {
                padding: 12px;
                font-size: 14px;
            }
            
            button {
                padding: 12px;
                font-size: 14px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">
            <h1>⚡ AZ Tricks</h1>
        </div>
        <div class="subtitle">🔍 SIM/CNIC Tracker by <a href="https://t.me/AZ_Tricks" target="_blank">@AZ_Tricks</a></div>
        
        <div class="input-group">
            <input type="text" id="queryInput" placeholder="03XXXXXXXXX or 1234512345671" inputmode="numeric" pattern="[0-9]*">
            <button id="searchBtn">🔍 Search</button>
        </div>
        
        <div class="format-hint">
            📱 <strong>03XXXXXXXXX</strong> (11 digits) &nbsp;|&nbsp; 🆔 <strong>1234512345671</strong> (13 digits)
        </div>

        <div class="quick-fill">
            <button class="quick-btn" data-value="03076305249">📱 Mobile</button>
            <button class="quick-btn" data-value="3330356760239">🆔 CNIC</button>
        </div>
        
        <div class="loader" id="loader">
            <div class="spinner"></div>
            <p style="margin-top: 10px; color: #666; font-size: 14px;">Fetching data...</p>
        </div>
        
        <div id="result">
            <div class="search-type" id="searchType">🔍 Searching for: <strong>N/A</strong></div>
            
            <div class="card">
                <div class="label">📌 Mobile Number</div>
                <div class="value" id="numberValue">-</div>
            </div>
            <div class="card">
                <div class="label">👤 Name</div>
                <div class="value" id="nameValue">-</div>
            </div>
            <div class="card">
                <div class="label">🆔 CNIC</div>
                <div class="value" id="cnicValue">-</div>
            </div>
            <div class="card">
                <div class="label">📍 Address</div>
                <div class="value" id="addressValue">-</div>
            </div>
            <div class="card">
                <div class="label">📊 Status</div>
                <div class="value" id="statusValue">-</div>
            </div>
            
            <div class="credit">
                ⚡ Powered by <a href="https://t.me/AZ_Tricks" target="_blank">@AZ_Tricks</a>
            </div>
        </div>
        
        <div class="footer">
            Made with ❤️ by AZ Tricks
        </div>
    </div>

    <script>
        const searchBtn = document.getElementById('searchBtn');
        const queryInput = document.getElementById('queryInput');
        const resultDiv = document.getElementById('result');
        const loader = document.getElementById('loader');

        // Quick fill buttons
        document.querySelectorAll('.quick-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                queryInput.value = btn.dataset.value;
                searchBtn.click();
            });
        });

        searchBtn.addEventListener('click', async () => {
            const query = queryInput.value.replace(/[^0-9]/g, '');
            
            if (query.length < 10) {
                alert('Please enter:\n📱 Mobile: 03XXXXXXXXX (11 digits)\n🆔 CNIC: 1234512345671 (13 digits)');
                return;
            }

            loader.classList.add('active');
            resultDiv.style.display = 'none';
            searchBtn.disabled = true;
            searchBtn.textContent = '⏳ Searching...';

            try {
                const response = await fetch('/api/track?query=' + encodeURIComponent(query));
                const data = await response.json();

                if (data.error) {
                    alert(data.error);
                    searchBtn.disabled = false;
                    searchBtn.textContent = '🔍 Search';
                    loader.classList.remove('active');
                    return;
                }

                // Display search type
                document.getElementById('searchType').innerHTML = 
                    `🔍 ${data.search_type}: <strong>${data.input || query}</strong>`;
                
                // Display results
                document.getElementById('numberValue').textContent = data.number || 'Not Found';
                document.getElementById('nameValue').textContent = data.name || 'Not Found';
                document.getElementById('cnicValue').textContent = data.cnic || 'Not Found';
                document.getElementById('addressValue').textContent = data.address || 'Not Found';
                
                const statusEl = document.getElementById('statusValue');
                if (data.status === 'Success') {
                    statusEl.innerHTML = '<span class="status-badge status-success">✅ Found</span>';
                } else {
                    statusEl.innerHTML = '<span class="status-badge status-failed">❌ Not Found</span>';
                }

                resultDiv.style.display = 'block';

            } catch (error) {
                alert('Error fetching data. Please try again.\n\nCredit: @AZ_Tricks');
            } finally {
                loader.classList.remove('active');
                searchBtn.disabled = false;
                searchBtn.textContent = '🔍 Search';
            }
        });

        // Enter key support
        queryInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') searchBtn.click();
        });

        // Only allow numbers
        queryInput.addEventListener('input', function() {
            this.value = this.value.replace(/[^0-9]/g, '');
        });
    </script>
</body>
</html>
